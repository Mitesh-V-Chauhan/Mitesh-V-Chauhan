name: Update GitHub stats cards

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs slightly)
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"         # don't re-trigger on our own card commits
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=6'
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch streak card (fresh, cache-busted)
        run: |
          mkdir -p profile
          URL="https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&cb=$(date +%s)"
          if curl -fsSL --max-time 30 "$URL" -o /tmp/streak.svg && grep -q "Current Streak" /tmp/streak.svg; then
            mv /tmp/streak.svg profile/streak.svg
          else
            echo "Streak service unavailable or returned an error - keeping previous card."
          fi

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats cards"
          git pull --rebase
          git push
